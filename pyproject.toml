[project]
name = "sparseforge"
version = "0.1.0"
description = "SparseForge - 世界级压缩感知 / 稀疏信号恢复系统（作者 晨星）"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "晨星", email = "CJX0712@users.noreply.github.com" }]
keywords = [
  "compressed-sensing",
  "sparse-recovery",
  "optimization",
  "numerical-linear-algebra",
]
classifiers = [
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]
dependencies = ["numpy>=2.0", "scipy>=1.13", "scikit-learn>=1.5"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff==0.16.10"]

[project.scripts]
sparseforge = "cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = [
  "core",
  "data",
  "cs",
  "preprocess",
  "hpo",
  "training",
  "eval",
  "pipeline",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 96
target-version = "py312"
exclude = [".venv", "build", "dist", "__pycache__"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "SIM", "RUF", "PLW", "B", "N", "W"]
ignore = ["E501", "N803", "N806", "RUF001", "RUF002", "RUF003", "PLW2901"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["N802", "N803"]
"examples/*" = ["N802", "N803"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.coverage.run]
source = ["core", "data", "cs", "preprocess", "hpo", "training", "eval", "pipeline"]
omit = ["*/__init__.py", "cli.py"]
